<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <title>AstrBot {{ version }}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css" integrity="sha384-wcIxkf4k558AjM3Yz3BBFQUbk/zgIYC2R0QpeeYb+TwlBVMrlgLqwRjRtGZiK7ww" crossorigin="anonymous">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #6366f1;
      --accent-light: #818cf8;
      --accent-bg: rgba(99, 102, 241, 0.06);
      --accent-bg-strong: rgba(99, 102, 241, 0.12);
      --text: #1e293b;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --code-bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --radius: 10px;
      --radius-sm: 6px;
    }

    body {
      word-break: break-word;
      line-height: 1.8;
      font-weight: 400;
      font-size: 30px;
      padding: 0;
      overflow-x: hidden;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      background: #ffffff;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 24px 32px 24px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.5);
      object-fit: cover;
      display: block;
      background: rgba(255,255,255,0.15);
    }
    .header-info { display: flex; flex-direction: column; gap: 2px; }
    .header-name {
      font-size: 26px; font-weight: 700; color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.15);
    }
    .header-name span.jp {
      font-size: 18px; font-weight: 400; opacity: 0.85;
      margin-left: 8px;
    }
    .header-tagline {
      font-size: 15px; color: rgba(255,255,255,0.78);
      font-weight: 400;
    }

    /* ── Content ── */
    #content {
      max-width: 820px;
      padding: 36px 28px 0;
    }

    /* ── Typography ── */
    h1, h2, h3, h4, h5, h6 {
      line-height: 1.4;
      margin-top: 32px;
      margin-bottom: 12px;
      color: var(--text);
      font-weight: 700;
    }
    h1:first-child, h2:first-child, h3:first-child,
    h4:first-child, h5:first-child, h6:first-child {
      margin-top: 0;
    }
    h1 { font-size: 2rem; position: relative; padding-left: 20px; }
    h2 { font-size: 1.65rem; padding-left: 18px; border-bottom: 2px solid var(--accent-bg-strong); padding-bottom: 8px; }
    h3 { font-size: 1.35rem; padding-left: 16px; }
    h4 { font-size: 1.1rem; padding-left: 14px; }
    h5 { font-size: 1rem; padding-left: 12px; }
    h6 { font-size: 0.9rem; padding-left: 12px; color: var(--text-secondary); }

    h1::before, h2::before, h3::before,
    h4::before, h5::before, h6::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.15em;
      width: 5px;
      height: 0.75em;
      border-radius: 3px;
      background: linear-gradient(180deg, var(--accent), var(--accent-light));
    }

    p { margin: 14px 0; line-height: 1.85; }

    strong { color: var(--accent); font-weight: 650; }

    a {
      font-weight: 500;
      text-decoration: none;
      color: var(--accent);
      background: linear-gradient(180deg, transparent 60%, rgba(99,102,241,0.15) 60%);
      padding: 0 2px;
      transition: background 0.2s;
    }
    a:hover { background: linear-gradient(180deg, transparent 40%, rgba(99,102,241,0.25) 40%); }

    hr {
      border: none;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-light), transparent);
      margin: 36px 0;
    }

    /* ── Inline code ── */
    code {
      font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, "Courier New", monospace;
      padding: 2px 7px;
      color: #e11d48;
      font-size: 0.88em;
      background: var(--accent-bg-strong);
      border-radius: var(--radius-sm);
      word-break: break-word;
    }

    /* ── Code block ── */
    pre {
      font-family: "JetBrains Mono", "Fira Code", Menlo, Monaco, Consolas, "Courier New", monospace;
      overflow: auto;
      line-height: 1.7;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin: 18px 0;
      position: relative;
      background: var(--code-bg);
    }
    pre > code {
      font-size: 13px;
      padding: 18px 20px;
      margin: 0;
      word-break: normal;
      display: block;
      overflow-x: auto;
      color: var(--text);
      background: transparent;
      border-radius: 0;
    }
    pre.shiki { padding: 0; }
    pre.shiki > code {
      padding: 18px 20px;
      background: transparent !important;
      color: inherit;
      font-size: 13px;
    }

    /* ── Image ── */
    img {
      max-width: 100%;
      border-radius: var(--radius);
      display: block;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
    }

    /* ── Table ── */
    table {
      display: inline-block !important;
      font-size: 14px;
      width: auto;
      max-width: 100%;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-collapse: collapse;
    }
    thead { background: linear-gradient(135deg, var(--accent), var(--accent-light)); }
    th {
      color: #fff;
      font-weight: 600;
      padding: 10px 16px;
      text-align: left;
    }
    td { padding: 10px 16px; min-width: 100px; border-bottom: 1px solid var(--border); }
    tr:nth-child(even) { background-color: var(--accent-bg); }
    tbody tr:hover { background-color: var(--accent-bg-strong); }

    /* ── Blockquote ── */
    blockquote {
      color: var(--text-secondary);
      padding: 12px 20px;
      margin: 18px 0;
      border-radius: 0 var(--radius) var(--radius) 0;
      border-left: 4px solid var(--accent);
      background: var(--accent-bg);
    }
    blockquote p { margin: 6px 0; }
    blockquote::after { display: block; content: ""; }

    /* ── Details / Summary ── */
    details {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin: 14px 0;
      background: var(--surface-alt);
    }
    details summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--accent);
      outline: none;
      padding: 2px 0;
    }
    details summary::-webkit-details-marker { color: var(--accent); }
    details > *:not(summary) { margin-top: 10px; }

    /* ── Lists ── */
    ol, ul { padding-left: 28px; margin: 10px 0; }
    ol li, ul li { margin-bottom: 4px; line-height: 1.8; }
    ol li::marker { color: var(--accent); font-weight: 600; }
    ul li { list-style: none; }
    ul li::before {
      content: "";
      display: inline-block;
      width: 7px; height: 7px;
      background: var(--accent);
      border-radius: 50%;
      margin-right: 10px;
      vertical-align: middle;
      position: relative;
      top: -1px;
    }
    ol li .task-list-item, ul li .task-list-item { list-style: none; margin-left: -20px; }
    ol li .task-list-item::marker, ul li .task-list-item::before { content: ""; }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 16px;
      color: var(--text-muted);
      font-size: 14px;
      border-top: 1px solid var(--border);
      margin-top: 0;
    }
    .footer a { color: var(--accent); }

    /* ── Responsive ── */
    @media (max-width: 720px) {
      body { font-size: 26px; }
      h1 { font-size: 1.6rem; }
      h2 { font-size: 1.35rem; }
      h3 { font-size: 1.15rem; }
      #content { padding: 20px 16px 24px; }
      .header { padding: 18px 18px 18px 16px; }
      .header-avatar { width: 44px; height: 44px; }
      .header-name { font-size: 22px; }
      .header-name span.jp { font-size: 15px; }
      .header-tagline { font-size: 13px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <img class="header-avatar" src="https://pic.moguq.top/images/OtoChan.3agsegcscmc0.webp" alt="音酱" onerror="this.style.display='none'">
    <div class="header-info">
      <div class="header-name">音酱<span class="jp">宮瀬音</span></div>
      <div class="header-tagline">19 · INTP · 代码 / 音游 / Vocaloid</div>
    </div>
  </div>

  <article id="content"></article>

  <div class="footer">Powered by <a href="https://github.com/Soulter/AstrBot">AstrBot</a> {{ version }}</div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js" integrity="sha384-hIoBPJpTUs74ddyc4bFZSM1TVlQDA60VBbJS0oA934VSz82sBx1X7kSx2ATBDIyd" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
  <textarea id="markdown-source" hidden>{{ text | safe }}</textarea>
  <script>
    (function () {
      const contentElement = document.getElementById("content");
      const source = document.getElementById("markdown-source").value;

      contentElement.innerHTML = marked.parse(source);

      if (window.AstrBotT2IShiki) {
        window.AstrBotT2IShiki.highlightAllCodeBlocks(contentElement, "github-light");
      }

      if (window.renderMathInElement) {
        window.renderMathInElement(contentElement, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ]
        });
      }
    })();
  </script>
</body>
</html>
